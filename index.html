<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casa Cascola</title>
    <link rel="shortcut icon" href="Img/image.png" type="image/x-icon">
    <!-- <link rel="stylesheet" href="css/estilo.css"> -->
    <link rel="stylesheet" href="css/index.css">
</head>
<body>
    <header>
        <a class="header_logo" href="#Home"><img src="Img/image.png" alt=" Cascola" width="100px" height="auto"></a>
        <nav></nav>
    </header>

<main>
   <!-- 1. A casa -->
    <section class="palco" id="casa" data-palco data-modo="abertura" aria-label="Casa Cascola em 3D">
      <picture>
        <source media="(max-aspect-ratio: 1/1)" srcset="Img/casa-poster-celular.webp">
        <img class="palco__poster" src="Img/casa-poster.webp" alt="" width="1600" height="900">
      </picture>
      <canvas class="palco__cena" data-cena aria-hidden="true"></canvas>
      <div class="palco__veu" aria-hidden="true"></div>
      <div class="pinos" data-pinos></div>

      <div class="abertura" data-abertura>
        <h1>Orgulho de fazer bem&nbsp;feito.</h1>
        
        <div class="abertura__acoes">
          <button class="botao botao--laranja" type="button" data-acao="ver-casa">Ver a casa 3D</button>
        </div>
      </div>

      <div class="carregando" role="status" data-carregando>
        <span class="carregando__barra"><span data-carregando-barra></span></span>
      </div>

      <button class="palco__voltar" type="button" data-acao="voltar" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Voltar
      </button>

      <aside class="gaveta" data-gaveta data-aberta="false" data-vista="todos" aria-label="Produtos Cascola">
        <button class="gaveta__alca" type="button" data-acao="menu" aria-expanded="false" aria-controls="gaveta-corpo">
          <svg class="gaveta__icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11 12 4l9 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 10v10h12V10" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><path d="M10.5 20v-5.5h3V20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/></svg>
          <span class="gaveta__rotulo">Produtos</span>
          <svg class="gaveta__seta" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="gaveta__corpo" id="gaveta-corpo">
          <div class="gaveta__cabeca" data-menu-cabeca aria-live="polite"></div>
          <ul class="vitrine" data-vitrine></ul>
        </div>
      </aside>
      <p class="palco__aviso" data-aviso hidden></p>
    </section>


     <!-- 1b. Ficha do produto: aparece quando alguém toca em "Mais detalhes" -->
    <section class="ficha" id="detalhes" data-ficha hidden aria-label="Ficha do produto">
      <div class="largura">
        <div data-ficha-conteudo></div>
        <div class="ficha__outros" data-ficha-outros></div>
      </div>
    </section>


  
  </main>


    <script src="js/app.js"></script>
</body>
</html>
